  # ============================================================
  # YAML anchor: shared vLLM base config (DRY for multi-model)
  # Each model gets its own service below with a unique profile.
  # Only ONE vllm instance runs at a time (VRAM exclusive).
  # Port 9997 is shared — no conflict since they're mutually exclusive.
  # Router orchestrates switching via Docker SDK start/stop.
  # First-time setup: docker compose --profile llm-xxx up -d vllm-xxx
  #
  # ⚠️ Container names, profiles and model paths for every GPU service are
  # ALSO listed in config/gpu-registry.json — that file is what Router,
  # ai_webapp and scripts/service.sh read. Compose cannot read it (profiles
  # must be literal YAML), so when you add or rename a GPU container, edit
  # both this file and the registry. Nothing else needs touching.
  # ============================================================
x-vllm-base: &vllm-base
  image: vllm/vllm-openai:latest
  restart: "no"              # Manual start only — Router uses Docker SDK start (not compose)
  ports:
    - "9997:8000"  # External 9997 (backward compat), internal vLLM default 8000
  environment:
    - VLLM_ENABLE_V1_MULTIPROCESSING=0
    - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1  # vLLM v0.18+ accurate CUDA graph memory accounting
  volumes:
    - ${MODELS_PATH:-./models}:/models    # Unified model storage — set MODELS_PATH in .env
  shm_size: 8gb
  ipc: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, compute, utility]
  networks:
    - default

services:
  # ============================================================
  # 1a. vLLM — Qwen 2.5 32B AWQ (production default)
  #     Profile: llm-qwen | Container: ai_vllm_qwen
  #     Set COMPOSE_PROFILES=llm-qwen in .env for auto-start
  # ============================================================
  vllm-qwen:
    <<: *vllm-base
    container_name: ai_vllm_qwen
    profiles: ["llm-qwen"]
    command:
      - --model
      - /models/qwen2.5-32b-instruct-awq  # Production 32B AWQ model (upgraded 2026-04-02)
      - --gpu-memory-utilization
      - "0.98"  # Increased from 0.95: Qwen 32B needs more VRAM for KV cache
      - --max-model-len
      - "8192"  # Reduced from 9600: fit in VRAM with vLLM 0.20.1 overhead
      - --trust-remote-code
      - --enable-auto-tool-choice        # Required for OpenClaw/agent tool calls
      - --tool-call-parser
      - hermes                           # Qwen2.5 uses Hermes-style tool call format
      - --host
      - "0.0.0.0"
      - --port
      - "8000"

  # ============================================================
  # 1b. vLLM — Gemma 4 26B A4B (MoE, AWQ 4-bit)
  #     Profile: llm-gemma | Container: ai_vllm_gemma
  #     Model: cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit (~16 GB)
  #     Download: ./paas-controller.sh prepare   (downloads all registered models)
  #     ⚠️ Only ONE vllm instance runs at a time (VRAM exclusive).
  # ============================================================
  vllm-gemma:
    <<: *vllm-base
    container_name: ai_vllm_gemma
    profiles: ["llm-gemma"]
    command:
      - --model
      - /models/gemma-4-26B-A4B-awq      # MoE 25.2B total / 3.8B active — AWQ ~13GB
      - --gpu-memory-utilization
      - "0.95"  # MoE ~13GB AWQ; need more for KV cache
      - --max-model-len
      - "4096"  # Reduced to fit in VRAM with MoE overhead
      - --trust-remote-code
      - --max-num-batched-tokens
      - "4096"                                 # Match max_model_len
      - --host
      - "0.0.0.0"
      - --port
      - "8000"

  # ============================================================
  # ⛔ DISABLED (Phase 4.5): LiteLLM replaced by Router
  # 2. LiteLLM PostgreSQL — was: postgres backing store
  # 3. LiteLLM API gateway — was: model routing + key management
  # Replaced by services/router (FastAPI + SQLite + API key middleware)
  # ============================================================
  # litellm-db: ...  (see archived litellm notes in docs/)
  # litellm: ...     (router:4000 now owns /v1/chat/completions)

  # ============================================================
  # 4. Speaches (faster-whisper-server) - Speech-to-Text (STT)
  #    OpenAI-compatible /v1/audio/transcriptions endpoint
  #    Phase 2 Step 2.2 — deployed 2026-03-30
  #    Image: ghcr.io/speaches-ai/speaches (repo renamed from fedirz/faster-whisper-server)
  #    Model: Systran/faster-whisper-large-v3 (~3-4 GB VRAM)
  #    VRAM budget: vLLM=~17GB + Whisper=~4GB = ~21GB of 24GB
  #    NOTE: PRELOAD_MODELS does NOT auto-download. After first start, download model via:
  #    curl -X POST http://192.168.0.19:9998/v1/models/Systran%2Ffaster-whisper-large-v3
  # ============================================================
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    container_name: ai_whisper
    restart: unless-stopped
    ports:
      - "9998:8000"
    environment:
      - WHISPER__INFERENCE_DEVICE=cuda
      - WHISPER__COMPUTE_TYPE=float16
      # PRELOAD_MODELS is parsed but only queues download — model still needs POST /v1/models/{id}
      # to actually download. Kept here for documentation of intended default model.
      - PRELOAD_MODELS=["Systran/faster-whisper-large-v3"]
    volumes:
      - whisper_model_cache:/home/ubuntu/.cache/huggingface/hub  # HF model cache (persists across restarts)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default

  # ============================================================
  # 5. ComfyUI — Visual generation (video / digital human)
  #    Phase 3 Step 3.2 — image tested 2026-03-31
  #    Phase 3 Step 3.3 — CogVideoX-5B workflow; CLI_ARGS fixed 2026-04-01
  #    Image: yanwk/comfyui-boot:cu130-slim-v2 (CUDA 13.0 native, slim)
  #    Port: 8188 (ComfyUI default)
  #    ⚠️ NEVER start while ai_vllm is running — VRAM exclusive
  #    restart: no — must be started manually (Phase 2 /gpu panel or CLI)
  #    Models: ${MODELS_PATH}/comfyui/{checkpoints,vae,...} per ComfyUI layout
  # ============================================================
  # ⚠️ ComfyUI is GPU-exclusive and Router-scheduled, same as idphoto below.
  # The profile is a start-time filter, not a lock: it keeps `docker compose
  # up -d` from booting ComfyUI next to a vLLM. Compose creates the container,
  # the Router starts/stops it per config/gpu-registry.json.
  # First creation: `docker compose --profile comfyui up -d comfyui`
  # Profile: comfyui | Port: 8188 | No auto-restart
  comfyui:
    image: yanwk/comfyui-boot:cu130-slim-v2
    container_name: ai_comfyui
    profiles: ["comfyui"]   # Keep out of COMPOSE_PROFILES — Router schedules this
    restart: "no"
    ports:
      - "8188:8188"
    volumes:
      - ${MODELS_PATH:-./models}/comfyui:/root/ComfyUI/models        # ComfyUI models — set MODELS_PATH in .env
      - ${COMFYUI_MODELS_HDD:-/dev/null}:/mnt/hdd_models                     # Optional: secondary HDD mount
      - ./data/comfyui_workdir:/root/ComfyUI                          # ComfyUI state + installed custom nodes
      - ./data/comfyui_extra_model_paths.yaml:/root/ComfyUI/extra_model_paths.yaml
      - ./data/comfyui_workflows:/root/ComfyUI/workflows              # Pre-bundled workflows (git-tracked)
      - ./services/comfyui/setup.sh:/root/ComfyUI/setup.sh:ro        # Auto-setup script (git-tracked)
      - ./libs:/root/ComfyUI/libs:ro                                 # Bash libs setup.sh sources (git-tracked)
      - ./services/comfyui/user-scripts:/root/user-scripts           # pre-start.sh hook (git-tracked, needs rw for exec)
    environment:
      # No --lowvram: ComfyUI runs exclusively with full 24 GB (vLLM is stopped before ComfyUI starts).
      # --lowvram would unnecessarily degrade CogVideoX quality. RTX 3090 = 24 GB exclusive.
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
      - COMFYUI_MODELS_HDD=/mnt/hdd_models                                    # HDD mount path inside container
      - HF_TOKEN=${HF_TOKEN:-}                                                 # Optional: HuggingFace token for gated models
      - TZ=Asia/Hong_Kong                                                      # Container timezone (Hong Kong)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default

  # ============================================================
  # 6. Router Redis — Celery broker + result backend
  # ============================================================
  router-redis:
    image: redis:7-alpine
    container_name: ai_router_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/router_redis:/data
    networks:
      - default

  # ============================================================
  # 7. Router — GPU Orchestrator (Phase 4)
  #    FastAPI + Celery + Redis + SQLite
  #    Replaces LiteLLM in Phase 4.5
  # ============================================================
  router:
    build: ./services/router
    container_name: ai_router
    restart: unless-stopped
    ports:
      - "4000:4000"  # Phase 4.5: replaced LiteLLM
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MODELS_PATH:-./models}:/models
      - ./data/router_db:/app/db  # SQLite task persistence
      - ./config/gpu-registry.json:/config/gpu-registry.json:ro  # single source of truth for GPU containers
    environment:
      - ROUTER_PORT=4000
      - REDIS_URL=redis://ai_router_redis:6379/0
      - CELERY_BROKER_URL=redis://ai_router_redis:6379/1
      - CELERY_RESULT_BACKEND=redis://ai_router_redis:6379/2
      - DATABASE_URL=sqlite+aiosqlite:///./db/router.db
      - VLLM_BASE_URL=http://ai_vllm_qwen:8000  # Default; Router uses the GPU registry for multi-model
      - WHISPER_BASE_URL=http://ai_whisper:8000
      - COMFYUI_BASE_URL=http://ai_comfyui:8188
      - ROUTER_API_KEY=${LITELLM_MASTER_KEY:-sk-change-me}
      - MODELS_ROOT=/models
      - GPU_REGISTRY_PATH=/config/gpu-registry.json
    depends_on:
      - router-redis
    networks:
      - default

  # ============================================================
  # 7b. Router Celery Worker — async GPU switching + task queue
  # ============================================================
  router-worker:
    build: ./services/router
    container_name: ai_router_worker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker SDK for container control
      - ./config/gpu-registry.json:/config/gpu-registry.json:ro  # single source of truth for GPU containers
    environment:
      - CELERY_BROKER_URL=redis://ai_router_redis:6379/1
      - CELERY_RESULT_BACKEND=redis://ai_router_redis:6379/2
      - VLLM_BASE_URL=http://ai_vllm_qwen:8000  # Default; Router uses the GPU registry for multi-model
      - WHISPER_BASE_URL=http://ai_whisper:8000
      - COMFYUI_BASE_URL=http://ai_comfyui:8188
      - MODELS_ROOT=/models
      - GPU_REGISTRY_PATH=/config/gpu-registry.json
    depends_on:
      - router-redis
    networks:
      - default
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel", "info", "--concurrency", "2"]

  # ============================================================
  # 8. Web App — Unified UI (subtitle / translate / GPU panel / model manager)
  #    Phase 2 Steps 2.4–2.7; model manager added 2026-04-02
  #    Accessible at http://192.168.0.19:8888
  #    Routes: / /subtitle /translate /gpu /models
  # ============================================================
  webapp:
    build: ./services/webapp
    container_name: ai_webapp
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - LITELLM_BASE_URL=http://ai_router:4000/v1
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:-sk-1234}
      - WHISPER_BASE_URL=http://ai_whisper:8000/v1
      - IDPHOTO_BASE_URL=http://ai_idphoto:7860   # reverse-proxied at /idphoto/ui; 7860 is not published on the host
      - LLM_MODEL=qwen
      - WHISPER_MODEL=Systran/faster-whisper-large-v3
      - MODELS_ROOT=/models                   # path inside container where model weights live
      - COMFYUI_MODELS_HDD=${COMFYUI_MODELS_HDD:-}  # host path for large ComfyUI models
      - VLLM_CONTAINER=ai_vllm_qwen            # default container name; webapp delegates to Router for switching
      - GPU_REGISTRY_PATH=/config/gpu-registry.json
      - HF_TOKEN=${HF_TOKEN:-}               # optional: HuggingFace token for gated models
      - YTDLP_COOKIES_PATH=/cookies/cookies.txt  # optional: yt-dlp cookie file for YouTube auth
      - MEDIA_ROOT=${MEDIA_ROOT:+/media}         # set to /media only when MEDIA_ROOT is configured
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # GPU panel: docker API + nvidia-smi via exec into vllm containers
      - ${MODELS_PATH:-./models}:/models                       # model manager: read/write model weights
      - ./config/gpu-registry.json:/config/gpu-registry.json:ro  # single source of truth for GPU containers
      - ./data/comfyui_workflows:/comfyui_workflows:ro         # built-in workflow JSONs for browser UI
      - ./data/cookies:/cookies:ro                             # yt-dlp cookies (managed by ai_cookie_manager)
      - ${MEDIA_ROOT:-./data/media}:/media                     # media storage for downloads (NFS or local)
      - ./.env:/app/.env-host:rw                              # wiki config toggle: sync WIKI_READ_ONLY to .env
    networks:
      - default
    depends_on:
      - router
      - whisper

  # ============================================================
  # Cookie Manager — automatic yt-dlp cookie renewal
  # Profile-gated: docker compose --profile cookies up -d
  # One-time: open noVNC at http://localhost:6901 and log into YouTube
  # After login, cookies auto-refresh every 6 hours
  # ============================================================
  cookie-manager:
    build: ./services/cookie-manager
    container_name: ai_cookie_manager
    profiles: ["cookies"]
    restart: unless-stopped
    ports:
      - "6901:6901"   # noVNC web UI
      - "127.0.0.1:6902:6902"   # health API (internal only)
    volumes:
      - ./data/cookies:/cookies                    # shared with ai_webapp (read-only there)
      - ./data/chrome-profile:/data/chrome-profile # persistent Chromium login session
    environment:
      - REFRESH_INTERVAL_HOURS=6
      - COOKIE_OUTPUT=/cookies/cookies.txt
      - DISPLAY=:99
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6902/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ============================================================
  # 9. Vault RAG — Obsidian knowledge base AI query (Phase 6)
  #    FastAPI + ChromaDB + BGE embedding + vLLM
  #    Ports: 8081 (RAG API)
  # ============================================================
  rag:
    build: ./services/rag
    container_name: ai_rag
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ${VAULT_PATH:-/Development/backup/PARA-Vault}:/vault
      - ./data/rag_chroma:/db/chroma
      - ${MODELS_PATH:-./models}:/models:ro
    environment:
      - RAG_PORT=8081
      - CHROMA_DB_PATH=/db/chroma
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
      - VAULT_PATH=/vault
      - ROUTER_BASE_URL=http://ai_router:4000
      - ROUTER_API_KEY=${LITELLM_MASTER_KEY:-sk-change-me}
      - WIKI_READ_ONLY=${WIKI_READ_ONLY:-false}
      - WIKI_LLM_MODEL=${WIKI_LLM_MODEL:-qwen}
      - WIKI_MAX_CHUNK_TOKENS=${WIKI_MAX_CHUNK_TOKENS:-3500}
      - WIKI_MAX_OUTPUT_TOKENS=${WIKI_MAX_OUTPUT_TOKENS:-1600}
    depends_on:
      - router
    networks:
      - default

  # ============================================================
  # 10. HivisionIDPhotos — AI ID photo (manual-install sandbox)
  #     The image is an EMPTY shell: apt system libs only, zero pip
  #     packages, no app code. Everything is installed into the container
  #     after it is created. Full walkthrough: services/idphoto/README.md
  #
  #     One-time setup:
  #       ./paas-controller.sh prepare        # stage 2 does all of it:
  #         creates ${MODELS_PATH}/idphoto/{src,pip-cache}, clones upstream,
  #         downloads + size-verifies the two ONNX weights, then offers to
  #         build this container and run 2-install.sh inside it.
  #     By hand instead:
  #       1. bash services/idphoto/1-download-weights.sh   (on the host)
  #       2. docker compose --profile idphoto up -d --build idphoto
  #       3. docker exec -it ai_idphoto bash /opt/idphoto/2-install.sh
  #       4. docker restart ai_idphoto      -> 0-entrypoint.sh runs 3-run.sh
  #       5. open /idphoto on ai_webapp (7860 is not published)
  #
  #     After that, step 3 is done for good: pip packages live in the
  #     container's writable layer, so 0-entrypoint.sh takes every later
  #     start straight to the WebUI — a plain restart, or the Router
  #     starting this container during a GPU-mode switch.
  #
  #     Reset: docker compose rm -sf idphoto, then back to step 2. Clone,
  #     weights and pip cache are host bind mounts and survive.
  #     `clean model` / `clean all` DO delete them — re-run prepare, which
  #     also recreates this container if its mounts went stale.
  #
  #     ⚠️ GPU-exclusive: birefnet-v1-lite wants ~16 GB VRAM and vLLM holds
  #        ~22 GB of this 24 GB card. Registered as an exclusive service in
  #        config/gpu-registry.json, so the Router stops every vLLM before
  #        starting this, and stops this before starting a vLLM:
  #          curl -X POST :4000/gpu/mode -d '{"mode":"idphoto"}'
  #        or use the /gpu panel in ai_webapp.
  # ============================================================
  idphoto:
    build: ./services/idphoto
    container_name: ai_idphoto
    # A profile is NOT a GPU lock — it is a start-time filter. Keeping one here
    # means `docker compose up -d` only ever CREATES this container, never
    # starts it, which is precisely what hands scheduling to the Router: the
    # Router owns start/stop (Docker SDK) and enforces the one-holder-at-a-time
    # rule from config/gpu-registry.json. Drop the profile and compose would
    # boot idphoto alongside ai_vllm_qwen and both would fight over 24 GB.
    # Same pattern as comfyui above. Keep it out of COMPOSE_PROFILES.
    profiles: ["idphoto"]
    restart: "no"              # Router is the only thing that starts this
    # No `ports:` — 7860 is deliberately NOT published on the host. Every WebUI
    # on this box is reached through ai_webapp on :8888, which reverse-proxies
    # this container at /idphoto/ui (see services/webapp/main.py). 7860 stays
    # reachable as ai_idphoto:7860 inside ai_paas_network, which is all the
    # proxy needs.
    #
    # Changing this line forces `--force-recreate`, and pip packages live in the
    # container's writable layer — so re-run step 2 above afterwards.
    volumes:
      # src + pip-cache live under MODELS_PATH (/Development, 1 TB) — keeps the
      # ~330 MB of weights and the pip cache off the 196 GB system disk.
      - ${MODELS_PATH:-./models}/idphoto/src:/workspace              # git clone + weights — survive container deletion
      - ${MODELS_PATH:-./models}/idphoto/pip-cache:/root/.cache/pip  # makes reinstall-after-reset take seconds
      # Whole directory, NOT individual files: a single-file bind mount is
      # pinned to the source inode, so editing the file on the host swaps the
      # inode and the container keeps serving the old contents. Mounting the
      # directory means host edits take effect with no container restart.
      - ./services/idphoto:/opt/idphoto:ro                           # our scripts + requirements.txt
    environment:
      - TZ=Asia/Hong_Kong
      # Served behind ai_webapp's reverse proxy, not at the domain root, so
      # gradio has to know its own public subpath: it prefixes every asset and
      # file URL it hands the browser with this. app.py's --root_path defaults
      # to None, and gradio's launch() falls back to GRADIO_ROOT_PATH in that
      # case — so this needs no change to 3-run.sh.
      # Must match IDPHOTO_PREFIX in services/webapp/main.py.
      - GRADIO_ROOT_PATH=/idphoto/ui
      # Domestic PyPI mirror — onnxruntime-gpu alone is ~200 MB and the
      # upstream index is slow from here. Env var, so no rebuild needed.
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      - PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
    deploy:                    # Exposes the GPU; consumes no VRAM until a process allocates
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - default

networks:
  default:
    external: true
    name: ai_paas_network

volumes:
  whisper_model_cache:
